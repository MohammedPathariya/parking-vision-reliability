[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-vision-reliability"
version = "0.1.0"
description = "Reliability-aware parking occupancy from fixed-camera video"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<0.30",
]

[project.optional-dependencies]
dev = [
    "Pillow>=10,<13",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
where = ["src"]
